[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentry-ai"
version = "0.1.0"
description = "Beginner-friendly network-flow intrusion detection baseline"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1,<3", "scikit-learn>=1.3,<2", "joblib>=1.3,<2", "matplotlib>=3.7,<4"]

[tool.setuptools.packages.find]
where = ["src"]
