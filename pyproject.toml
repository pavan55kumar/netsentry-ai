[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentry-ai"
version = "2.0.0"
description = "Advanced Network Intrusion & Anomaly Detection ML Research Platform"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3",
    "scikit-learn>=1.3,<2",
    "joblib>=1.3,<2",
    "matplotlib>=3.7,<4",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "shap>=0.44.0",
    "scapy>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
